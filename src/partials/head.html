<meta name="description" content="Портфолио продуктового дизайнера Екатерины Ерошкиной" />
<!-- флаг «JS есть» — ставится до отрисовки, чтобы блоки с data-reveal
     стартовали скрытыми без мигания; без JS они просто видны сразу -->
<script>
  document.documentElement.classList.add("js");
  // При переходе между страницами (View Transitions) блоки, которые уже
  // в зоне видимости, показываем сразу и без анимации — чтобы кроссфейд
  // не «моргал» их появлением. Остальные появятся по скроллу как обычно.
  addEventListener("pagereveal", function (e) {
    if (!e.viewTransition) return;
    var touched = [];
    document
      .querySelectorAll("[data-reveal], .case .case-section > *")
      .forEach(function (el) {
        var r = el.getBoundingClientRect();
        if (r.top < innerHeight && r.bottom > 0) {
          el.style.transition = "none";
          el.classList.add("is-visible");
          touched.push(el);
        }
      });
    var restore = function () {
      touched.forEach(function (el) {
        el.style.transition = "";
      });
    };
    e.viewTransition.finished.then(restore, restore); // then+catch: гасим AbortError при отмене
  });
</script>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="stylesheet" href="/src/styles/main.css" />
