<div class="case-contact {{class}}">
  <span class="case-contact-bg" aria-hidden="true"></span>
  <button type="button" class="case-header-btn case-header-btn--contact" aria-expanded="false" aria-controls="case-contact-panel">
    <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 11 22 2l-9 19-2-8-8-2z" />
    </svg>
    <span>Связаться</span>
  </button>

  <div class="case-contact-panel" id="case-contact-panel" role="group" aria-label="Контакты" inert>
    <div class="cc-item cc-head" style="--i: 0">
      <span>Связаться</span>
      <button type="button" class="cc-close" aria-label="Закрыть">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M18 6 6 18M6 6l12 12" />
        </svg>
      </button>
    </div>

    <a class="cc-item cc-row" style="--i: 1" href="https://t.me/goatkiki" target="_blank" rel="noopener">
      <span class="cc-text">
        <span class="cc-label">Telegram</span>
        <span class="cc-value">@goatkiki</span>
      </span>
      <svg class="cc-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
      </svg>
    </a>

    <button type="button" class="cc-item cc-row" style="--i: 2" data-copy="katrine.eroshkina@gmail.com">
      <span class="cc-text">
        <span class="cc-label">Почта</span>
        <span class="cc-value">katrine.eroshkina@gmail.com</span>
      </span>
      <svg class="cc-icon cc-icon--copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="9" y="9" width="13" height="13" rx="2" />
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
      </svg>
      <svg class="cc-icon cc-icon--done" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
        <path d="M20 6 9 17l-5-5" />
      </svg>
    </button>

    <a class="cc-item cc-row" style="--i: 3" href="https://drive.google.com/file/d/12XLCL-TOZeNXS8M4y6XPEt4DH9H-KoMy/view?usp=sharing" target="_blank" rel="noopener">
      <span class="cc-text">
        <span class="cc-label">Резюме</span>
        <span class="cc-value">CV · Google Drive</span>
      </span>
      <svg class="cc-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
      </svg>
    </a>
  </div>
</div>
